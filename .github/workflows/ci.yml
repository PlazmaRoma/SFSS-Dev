# Проверка на трёх системах: установщик ставит SFSS и Anti-Fire на чистую машину,
# сервис отвечает, удаление убирает всё, тесты проходят. Нейросети в CI нет.
#
# Запускается на PR в main и по кнопке, а не на каждый коммит: у приватного репозитория
# минуты считаются, macOS идёт за десять.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/anti-fire/src-tauri

      - name: Установка SFSS (macOS, Linux)
        if: runner.os != 'Windows'
        run: ./install.sh --yes --no-llm

      - name: Установка SFSS (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -Yes -NoLlm

      - name: Сервис отвечает (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sfss status
          sfss predict --o2 0.30 --psi 8.2
          sfss predict --csv sfss/examples/runs.csv | tail -3
          sfss stop
          ./install.sh --yes --no-llm
          sfss stop

      - name: Сервис отвечает (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $sfss = "$env:LOCALAPPDATA\sfss\bin\sfss.cmd"
          & $sfss status; if ($LASTEXITCODE) { exit 1 }
          & $sfss predict --o2 0.30 --psi 8.2; if ($LASTEXITCODE) { exit 1 }
          & $sfss stop; if ($LASTEXITCODE) { exit 1 }
          & $sfss status; if ($LASTEXITCODE -eq 0) { Write-Host "демон не остановился"; exit 1 }
          exit 0

      - name: Тесты сервиса
        shell: bash
        working-directory: sfss
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          UV="$(command -v uv || true)"
          for candidate in ../.tools/uv ../.tools/uv.exe; do
            if [ -z "$UV" ] && [ -x "$candidate" ]; then UV="$candidate"; fi
          done
          "$UV" pip install --python "$PY" --quiet pytest
          "$PY" -m pytest -q

      - name: Тесты Площадки и Anti-Fire
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Библиотеки для окна (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Тесты окна Anti-Fire
        shell: bash
        run: |
          npm run page -w anti-fire
          cd apps/anti-fire/src-tauri && cargo test

      - name: Удаление убирает всё (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --uninstall --yes
          test ! -e "$HOME/.local/bin/sfss"
          test ! -e sfss/.venv
          test ! -e sfss/data/embedding
          test ! -e /Applications/Anti-Fire.app
          test ! -e "$HOME/.local/share/anti-fire"
          test -z "$(git status --porcelain)"

      - name: Удаление убирает всё (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -Uninstall
          foreach ($p in @("$env:LOCALAPPDATA\sfss\bin", "sfss\.venv", "sfss\data\embedding", "$env:LOCALAPPDATA\Programs\Anti-Fire")) {
            if (Test-Path $p) { Write-Host "осталось: $p"; exit 1 }
          }
          if (git status --porcelain) { git status --porcelain; exit 1 }
          exit 0
