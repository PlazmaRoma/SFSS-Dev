[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfss"
version = "0.2.0"
description = "Space Fire Security Software: fire behavior in microgravity from NASA data, as a local service"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
sfss = "app.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]
