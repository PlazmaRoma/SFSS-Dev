[package]
name = "anti-fire"
version = "1.0.0"
description = "Anti-Fire: a client of the SFSS service"
authors = ["Azamat Serik", "Roman Bushuyev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
